
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Loss Vegas Check</title>

<style>

/* =====================================
   基本設定
===================================== */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {

  background: #222;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  overflow: hidden;
}


/* =====================================
   小切手
===================================== */

.check {

  position: relative;

  width: min(94vw, 1100px);

  /*
    PCでは基本的に横長
  */
  aspect-ratio: 2 / 1;

  background: #f7f0d8;

  border: 4px solid #222;

  border-radius: 8px;

  box-shadow:
    0 15px 35px rgba(0,0,0,0.5),
    inset 0 0 0 6px #e1d5ae;

  padding: 5%;

  color: #222;

  overflow: hidden;
}


/* =====================================
   bg.jpg 透かし
===================================== */

.check::before {

  content: "";

  position: absolute;

  inset: 0;

  background-image: url("bg.jpg");

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

  opacity: 0.13;

  z-index: 0;

  pointer-events: none;
}


/* =====================================
   内側の枠
===================================== */

.check::after {

  content: "";

  position: absolute;

  inset: 14px;

  border: 1px solid rgba(50,50,50,0.7);

  pointer-events: none;

  z-index: 5;
}


/* =====================================
   コンテンツを前面に
===================================== */

.check > * {

  position: relative;

  z-index: 2;
}


/* =====================================
   ヘッダー
===================================== */

.check-header {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 20px;

  min-height: 18%;
}


.title {

  font-size:
    clamp(22px, 4vw, 48px);

  font-weight: bold;

  letter-spacing:
    clamp(2px, 0.4vw, 5px);

  line-height: 1;
}


.subtitle {

  margin-top: 5px;

  font-size:
    clamp(8px, 1.5vw, 15px);

  letter-spacing:
    clamp(1px, 0.25vw, 2px);
}


.number {

  flex-shrink: 0;

  text-align: right;

  font-size:
    clamp(9px, 1.5vw, 16px);

  white-space: nowrap;
}


/* =====================================
   PAY TO
===================================== */

.pay-to {

  width: 100%;

  margin-top: 3%;
}


.label {

  font-family: Arial, sans-serif;

  font-size:
    clamp(8px, 1.5vw, 15px);

  font-weight: bold;

  letter-spacing:
    clamp(1px, 0.25vw, 2px);

  white-space: nowrap;
}


.name-line {

  width: 100%;

  height:
    clamp(20px, 4vh, 35px);

  border-bottom:
    clamp(1px, 0.2vw, 2px)
    solid #333;
}


/* =====================================
   金額
===================================== */

.amount-area {

  width: 100%;

  display: flex;

  align-items: center;

  gap:
    clamp(7px, 1.2vw, 14px);

  margin-top: 3%;
}


.yen {

  flex-shrink: 0;

  font-size:
    clamp(30px, 5vw, 55px);

  font-weight: bold;

  line-height: 1;
}


.amount-input {

  min-width: 0;

  flex: 1;

  width: 100%;

  height:
    clamp(42px, 9vh, 75px);

  background: rgba(247,240,216,0.25);

  border: none;

  border-bottom:
    clamp(2px, 0.3vw, 3px)
    solid #333;

  outline: none;

  padding:
    0 clamp(5px, 1vw, 15px);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(26px, 5vw, 55px);

  font-weight: bold;

  text-align: right;

  color: #222;
}


.amount-input::placeholder {

  color: #999;
}


/* =====================================
   金額説明
===================================== */

.amount-words {

  width: 100%;

  margin-top: 1.5%;

  padding-bottom: 4px;

  border-bottom: 1px solid #555;

  font-size:
    clamp(8px, 1.5vw, 15px);

  font-style: italic;

  white-space: nowrap;
}


/* =====================================
   フッター
===================================== */

.check-footer {

  position: absolute !important;

  left: 5%;

  right: 5%;

  bottom: 5%;

  display: flex;

  justify-content: space-between;

  align-items: flex-end;

  gap: 20px;
}


.signature {

  margin-top: 2px;

  font-family:
    "Brush Script MT",
    cursive;

  font-size:
    clamp(15px, 3vw, 30px);

  line-height: 0.8;
}


.signature-line {

  width:
    clamp(100px, 18vw, 180px);

  border-bottom: 1px solid #333;
}


.currency {

  font-family: Arial, sans-serif;

  font-size:
    clamp(7px, 1.1vw, 13px);

  letter-spacing:
    clamp(1px, 0.2vw, 2px);

  white-space: nowrap;
}


/* =====================================
   スマホ横向き
===================================== */

@media screen
and (orientation: landscape)
and (max-width: 1024px) {

  .check {

    /*
      スマホの横画面に合わせる
    */
    width: 96vw;

    height: 92svh;

    /*
      aspect-ratioを解除
    */
    aspect-ratio: auto;

    padding:
      4vh 4vw;

    border-width: 2px;
  }


  .check::after {

    inset: 8px;
  }


  /* -------------------------
     ヘッダー
  ------------------------- */

  .check-header {

    min-height: auto;

    margin-bottom: 3vh;
  }


  .title {

    font-size:
      clamp(20px, 6vw, 38px);

    letter-spacing: 2px;
  }


  .subtitle {

    font-size:
      clamp(7px, 1.8vw, 12px);

    margin-top: 3px;
  }


  .number {

    font-size:
      clamp(8px, 1.6vw, 13px);
  }


  /* -------------------------
     PAY TO
  ------------------------- */

  .pay-to {

    margin-top: 0;

  }


  .label {

    font-size:
      clamp(7px, 1.8vw, 12px);
  }


  .name-line {

    height: 22px;
  }


  /* -------------------------
     金額
  ------------------------- */

  .amount-area {

    margin-top: 2vh;

    gap: 8px;
  }


  .yen {

    font-size:
      clamp(25px, 7vw, 45px);
  }


  .amount-input {

    height:
      clamp(38px, 9vh, 55px);

    font-size:
      clamp(23px, 6vw, 42px);
  }


  /* -------------------------
     金額説明
  ------------------------- */

  .amount-words {

    margin-top: 1vh;

    font-size:
      clamp(7px, 1.5vw, 11px);
  }


  /* -------------------------
     フッター
  ------------------------- */

  .check-footer {

    left: 4vw;

    right: 4vw;

    bottom: 2.5vh;
  }


  .currency {

    font-size:
      clamp(6px, 1.3vw, 10px);
  }


  .signature {

    font-size:
      clamp(13px, 3vw, 23px);
  }


  .signature-line {

    width:
      clamp(90px, 18vw, 150px);
  }

}


/* =====================================
   さらに高さが低いスマホ
===================================== */

@media screen
and (orientation: landscape)
and (max-width: 1024px)
and (max-height: 430px) {

  .check {

    height: 94svh;

    padding:
      2.5vh 3.5vw;
  }


  .check-header {

    margin-bottom: 1.5vh;
  }


  .title {

    font-size:
      clamp(18px, 5vw, 30px);
  }


  .subtitle {

    font-size:
      clamp(6px, 1.5vw, 10px);
  }


  .number {

    font-size:
      clamp(7px, 1.3vw, 10px);
  }


  .label {

    font-size:
      clamp(6px, 1.5vw, 10px);
  }


  .name-line {

    height: 17px;
  }


  .amount-area {

    margin-top: 1vh;
  }


  .yen {

    font-size:
      clamp(22px, 6vw, 35px);
  }


  .amount-input {

    height: 36px;

    font-size:
      clamp(20px, 5vw, 34px);
  }


  .amount-words {

    margin-top: 0.5vh;

    font-size:
      clamp(6px, 1.2vw, 9px);
  }


  .check-footer {

    bottom: 1.5vh;
  }


  .signature {

    font-size:
      clamp(12px, 2.5vw, 19px);
  }


  .currency {

    font-size:
      clamp(5px, 1.1vw, 8px);
  }

}


/* =====================================
   PC
===================================== */

@media screen and (min-width: 1025px) {

  .check {

    width: min(94vw, 1100px);

    height: auto;

    aspect-ratio: 2 / 1;
  }

}

</style>

</head>


<body>


<div class="check">


  <!-- ヘッダー -->

  <div class="check-header">

    <div>

      <div class="title">
        LOSS VEGAS
      </div>

      <div class="subtitle">
        OFFICIAL CHECK
      </div>

    </div>


    <div class="number">
      No. 000001
    </div>

  </div>


  <!-- 支払先 -->

  <div class="pay-to">

    <div class="label">
      PAY TO THE ORDER OF
    </div>

    <div class="name-line"></div>

  </div>


  <!-- 金額 -->

  <div class="amount-area">

    <div class="yen">
      $
    </div>

    <input
      class="amount-input"
      type="number"
      inputmode="numeric"
      placeholder="0"
      min="0"
    >

  </div>


  <!-- 金額説明 -->

  <div class="amount-words">
    AMOUNT IN UNITED STATES DOLLARS
  </div>


  <!-- フッター -->

  <div class="check-footer">

    <div>

      <div class="currency">
        AUTHORIZED SIGNATURE
      </div>

      <div class="signature-line"></div>

      <div class="signature">
        LOSS VEGAS
      </div>

    </div>


    <div class="currency">
      LOSS VEGAS CASINO
    </div>

  </div>


</div>


</body>

</html>
